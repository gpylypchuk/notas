<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Solape de f1 y f2</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@600;700&family=Lora:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --light: #f5efe0;
    --lightgray: #e3d5b8;
    --gray: #9c8b6a;
    --darkgray: #4a3f2f;
    --dark: #2c2418;
    --secondary: #b5651d;
    --tertiary: #4f6f52;
    --highlight: rgba(181, 101, 29, 0.15);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --light: #14111a;
      --lightgray: #2b2430;
      --gray: #5c5266;
      --darkgray: #d8cfc4;
      --dark: #f3e9d2;
      --secondary: #e8934a;
      --tertiary: #6b8f71;
      --highlight: rgba(232, 147, 74, 0.15);
    }
  }
  body {
    font-family: Lora, Georgia, serif;
    background: var(--light);
    color: var(--darkgray);
    margin: 0;
    padding: 4px 4px 20px;
  }
  .wrap {
    max-width: 720px;
    margin: 0 auto;
  }
  h1 {
    font-family: Fraunces, Georgia, serif;
    font-weight: 700;
    font-size: 19px;
    margin: 0 0 4px;
    color: var(--dark);
  }
  p.sub {
    margin: 0 0 18px;
    font-size: 13.5px;
    color: var(--gray);
  }
  .controls {
    display: flex;
    align-items: center;
    gap: 12px;
    margin-bottom: 6px;
    flex-wrap: wrap;
  }
  .controls label {
    font-family: Fraunces, Georgia, serif;
    font-size: 14px;
    font-weight: 600;
    color: var(--dark);
  }
  input[type="range"] {
    flex: 1;
    min-width: 180px;
    accent-color: var(--secondary);
  }
  .aval {
    font-variant-numeric: tabular-nums;
    font-weight: 700;
    color: var(--secondary);
    min-width: 54px;
    text-align: right;
  }
  .presets {
    display: flex;
    gap: 6px;
    margin: 10px 0 18px;
    flex-wrap: wrap;
  }
  .presets button {
    font-family: Lora, Georgia, serif;
    border: 1px solid var(--lightgray);
    background: transparent;
    border-radius: 6px;
    padding: 4px 10px;
    font-size: 12.5px;
    cursor: pointer;
    color: var(--darkgray);
  }
  .presets button:hover {
    background: var(--highlight);
    border-color: var(--secondary);
  }
  svg {
    width: 100%;
    height: auto;
    display: block;
  }
  .legend {
    display: flex;
    gap: 18px;
    flex-wrap: wrap;
    font-size: 12.5px;
    color: var(--darkgray);
    margin-top: 6px;
  }
  .legend span {
    display: inline-flex;
    align-items: center;
    gap: 6px;
  }
  .swatch {
    width: 14px;
    height: 3px;
    border-radius: 2px;
    display: inline-block;
  }
  .results {
    margin-top: 18px;
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 10px;
  }
  .card {
    background: var(--highlight);
    border: 1px solid var(--lightgray);
    border-radius: 8px;
    padding: 10px 12px;
    text-align: center;
  }
  .card .lbl {
    font-size: 11.5px;
    color: var(--gray);
    margin-bottom: 3px;
  }
  .card .val {
    font-family: Fraunces, Georgia, serif;
    font-size: 16px;
    font-weight: 700;
    color: var(--dark);
    font-variant-numeric: tabular-nums;
  }
  .note {
    margin-top: 16px;
    font-size: 12.5px;
    color: var(--gray);
    line-height: 1.5;
  }
</style>
</head>
<body>
<div class="wrap">
  <h1>f&#8321;(t) = &Lambda;(t &minus; a/2) y f&#8322;(t) = &Lambda;(t + a/2)</h1>
  <p class="sub">Mov&eacute; el deslizador para cambiar a y ver c&oacute;mo se separan o se superponen los dos tri&aacute;ngulos.</p>

  <div class="controls">
    <label for="aSlider">a =</label>
    <input type="range" id="aSlider" min="0" max="2.2" step="0.01" value="0.5">
    <span class="aval" id="aVal">0.50</span>
  </div>
  <div class="presets">
    <button data-a="0">a = 0</button>
    <button data-a="0.3">a = 0.3</button>
    <button data-a="0.5">a = 0.5</button>
    <button data-a="1">a = 1</button>
    <button data-a="2">a = 2</button>
  </div>

  <svg id="plot" viewBox="0 0 640 460" xmlns="http://www.w3.org/2000/svg"></svg>

  <div class="legend">
    <span><i class="swatch" id="sw-f1"></i> f&#8321;(t) = &Lambda;(t&minus;a/2)</span>
    <span><i class="swatch" id="sw-f2"></i> f&#8322;(t) = &Lambda;(t+a/2)</span>
    <span><i class="swatch" id="sw-overlap"></i> zona de solape</span>
    <span><i class="swatch" id="sw-xp"></i> x<sub>p</sub>(t)</span>
    <span><i class="swatch" id="sw-xi"></i> x<sub>i</sub>(t)</span>
  </div>

  <div class="results">
    <div class="card"><div class="lbl">E<sub>x</sub></div><div class="val">1/3</div></div>
    <div class="card"><div class="lbl">E<sub>xp</sub></div><div class="val" id="expVal">-</div></div>
    <div class="card"><div class="lbl">E<sub>xi</sub></div><div class="val" id="exiVal">-</div></div>
  </div>

  <p class="note" id="statusNote"></p>
</div>

<script>
(function(){
  var svg = document.getElementById('plot');
  var slider = document.getElementById('aSlider');
  var aValLabel = document.getElementById('aVal');
  var expVal = document.getElementById('expVal');
  var exiVal = document.getElementById('exiVal');
  var statusNote = document.getElementById('statusNote');

  var NS = 'http://www.w3.org/2000/svg';

  var mq = window.matchMedia('(prefers-color-scheme: dark)');
  function palette(){
    return mq.matches ? {
      f1:'#e8934a', f2:'#6b8f71', overlap:'rgba(232,147,74,0.30)',
      xp:'#f3e9d2', xi:'#d8cfc4', axis:'#5c5266', text:'#d8cfc4', bg:'#14111a'
    } : {
      f1:'#b5651d', f2:'#4f6f52', overlap:'rgba(181,101,29,0.30)',
      xp:'#2c2418', xi:'#4a3f2f', axis:'#9c8b6a', text:'#4a3f2f', bg:'#f5efe0'
    };
  }

  // Coordinate mapping
  var Tmin = -2.5, Tmax = 2.5;
  var PLOT_LEFT = 55, PLOT_RIGHT = 615;
  var PLOT_W = PLOT_RIGHT - PLOT_LEFT;

  // Top plot (f1, f2), value range
  var topVmin = -0.08, topVmax = 1.15;
  var topY0 = 20, topY1 = 190; // pixel range top to bottom

  // Bottom plot (xp, xi), value range
  var botVmin = -0.6, botVmax = 1.1;
  var botY0 = 250, botY1 = 420;

  function xPix(t){ return PLOT_LEFT + (t-Tmin)/(Tmax-Tmin)*PLOT_W; }
  function yPixTop(v){ return topY0 + (topVmax-v)/(topVmax-topVmin)*(topY1-topY0); }
  function yPixBot(v){ return botY0 + (botVmax-v)/(botVmax-botVmin)*(botY1-botY0); }

  function Lambda(t){ return Math.max(0, 1-2*Math.abs(t)); }

  function buildPoints(fn, yFn, N){
    var pts = [];
    for (var i=0;i<=N;i++){
      var t = Tmin + (Tmax-Tmin)*i/N;
      var v = fn(t);
      pts.push(xPix(t).toFixed(2)+','+yFn(v).toFixed(2));
    }
    return pts.join(' ');
  }

  function el(tag, attrs){
    var e = document.createElementNS(NS, tag);
    for (var k in attrs) e.setAttribute(k, attrs[k]);
    return e;
  }

  function ExpFormula(a){
    var aa = Math.abs(a);
    if (aa <= 0.5) return 1/3 - aa*aa + aa*aa*aa;
    if (aa <= 1) return 1/6 + Math.pow(1-aa,3)/3;
    return 1/6;
  }

  function updateLegendSwatches(pal){
    document.getElementById('sw-f1').style.background = pal.f1;
    document.getElementById('sw-f2').style.background = pal.f2;
    document.getElementById('sw-overlap').style.background = pal.overlap;
    document.getElementById('sw-xp').style.background = pal.xp;
    document.getElementById('sw-xi').style.background = pal.xi;
  }

  function draw(a){
    var pal = palette();
    updateLegendSwatches(pal);
    svg.innerHTML = '';

    svg.appendChild(el('rect', {x:0,y:0,width:640,height:460,fill:pal.bg}));

    // ---- TOP PLOT ----
    svg.appendChild(el('line', {x1:PLOT_LEFT, y1:yPixTop(0), x2:PLOT_RIGHT, y2:yPixTop(0), stroke:pal.axis, 'stroke-width':1}));
    svg.appendChild(el('line', {x1:xPix(0), y1:topY0-5, x2:xPix(0), y2:topY1, stroke:pal.axis, 'stroke-width':1}));

    [-2,-1,0,1,2].forEach(function(tt){
      var x = xPix(tt);
      svg.appendChild(el('line', {x1:x, y1:yPixTop(0)-3, x2:x, y2:yPixTop(0)+3, stroke:pal.axis}));
      var txt = el('text', {x:x, y:yPixTop(0)+16, 'font-size':11, 'text-anchor':'middle', fill:pal.text, 'font-family':'Lora, serif'});
      txt.textContent = tt;
      svg.appendChild(txt);
    });
    var y1lab = el('text', {x:PLOT_LEFT-8, y:yPixTop(1)+4, 'font-size':11, 'text-anchor':'end', fill:pal.text, 'font-family':'Lora, serif'});
    y1lab.textContent = '1';
    svg.appendChild(y1lab);

    var titleTop = el('text', {x:PLOT_LEFT, y:12, 'font-size':12, fill:pal.text, 'font-weight':'600', 'font-family':'Fraunces, serif'});
    titleTop.textContent = 'f1(t) y f2(t)';
    svg.appendChild(titleTop);

    // overlap shading: min(f1,f2) where both > 0
    var overlapPts = [];
    var N = 400;
    var anyOverlap = false;
    for (var i=0;i<=N;i++){
      var t = Tmin + (Tmax-Tmin)*i/N;
      var f1 = Lambda(t-a/2), f2 = Lambda(t+a/2);
      var m = Math.min(f1,f2);
      if (m>0) anyOverlap = true;
      overlapPts.push(xPix(t).toFixed(2)+','+yPixTop(m).toFixed(2));
    }
    if (anyOverlap){
      var poly = overlapPts.slice();
      poly.push(xPix(Tmax).toFixed(2)+','+yPixTop(0).toFixed(2));
      poly.push(xPix(Tmin).toFixed(2)+','+yPixTop(0).toFixed(2));
      svg.appendChild(el('polygon', {points: poly.join(' '), fill:pal.overlap, stroke:'none'}));
    }

    // f1, f2 curves
    svg.appendChild(el('polyline', {points: buildPoints(function(t){return Lambda(t-a/2);}, yPixTop, N), fill:'none', stroke:pal.f1, 'stroke-width':2.6}));
    svg.appendChild(el('polyline', {points: buildPoints(function(t){return Lambda(t+a/2);}, yPixTop, N), fill:'none', stroke:pal.f2, 'stroke-width':2.6}));

    // vertex markers at a/2 and -a/2
    [a/2, -a/2].forEach(function(tt, idx){
      var x = xPix(tt);
      svg.appendChild(el('line', {x1:x, y1:topY0, x2:x, y2:yPixTop(0), stroke: idx===0? pal.f1:pal.f2, 'stroke-width':1, 'stroke-dasharray':'4,3', opacity:0.6}));
    });

    // ---- BOTTOM PLOT ----
    svg.appendChild(el('line', {x1:PLOT_LEFT, y1:yPixBot(0), x2:PLOT_RIGHT, y2:yPixBot(0), stroke:pal.axis, 'stroke-width':1}));
    svg.appendChild(el('line', {x1:xPix(0), y1:botY0-5, x2:xPix(0), y2:botY1, stroke:pal.axis, 'stroke-width':1}));

    [-2,-1,0,1,2].forEach(function(tt){
      var x = xPix(tt);
      svg.appendChild(el('line', {x1:x, y1:yPixBot(0)-3, x2:x, y2:yPixBot(0)+3, stroke:pal.axis}));
      var txt = el('text', {x:x, y:yPixBot(0)+16, 'font-size':11, 'text-anchor':'middle', fill:pal.text, 'font-family':'Lora, serif'});
      txt.textContent = tt;
      svg.appendChild(txt);
    });

    var titleBot = el('text', {x:PLOT_LEFT, y:botY0-30, 'font-size':12, fill:pal.text, 'font-weight':'600', 'font-family':'Fraunces, serif'});
    titleBot.textContent = 'xp(t) = (f1+f2)/2   y   xi(t) = (f1-f2)/2';
    svg.appendChild(titleBot);

    svg.appendChild(el('polyline', {points: buildPoints(function(t){return (Lambda(t-a/2)+Lambda(t+a/2))/2;}, yPixBot, N), fill:'none', stroke:pal.xp, 'stroke-width':2.8}));
    svg.appendChild(el('polyline', {points: buildPoints(function(t){return (Lambda(t-a/2)-Lambda(t+a/2))/2;}, yPixBot, N), fill:'none', stroke:pal.xi, 'stroke-width':2.2, 'stroke-dasharray':'6,3'}));

    // labels for x axis "t"
    var tlab1 = el('text', {x:PLOT_RIGHT+6, y:yPixTop(0)+4, 'font-size':11, fill:pal.text, 'font-family':'Lora, serif'});
    tlab1.textContent = 't';
    svg.appendChild(tlab1);
    var tlab2 = el('text', {x:PLOT_RIGHT+6, y:yPixBot(0)+4, 'font-size':11, fill:pal.text, 'font-family':'Lora, serif'});
    tlab2.textContent = 't';
    svg.appendChild(tlab2);

    // results
    var ep = ExpFormula(a);
    var ei = 1/3 - ep;
    expVal.textContent = ep.toFixed(4);
    exiVal.textContent = ei.toFixed(4);

    if (Math.abs(a) >= 1){
      statusNote.textContent = '|a| = ' + a.toFixed(2) + ' ≥ 1, los soportes no se tocan. No hay zona sombreada, y Exp = Exi = 1/6 exactamente.';
    } else {
      statusNote.textContent = '|a| = ' + a.toFixed(2) + ' < 1, los triángulos se superponen (zona sombreada). Esa área de solape es la que hace que Exp y Exi se aparten de 1/6.';
    }
  }

  slider.addEventListener('input', function(){
    var a = parseFloat(slider.value);
    aValLabel.textContent = a.toFixed(2);
    draw(a);
  });

  document.querySelectorAll('.presets button').forEach(function(btn){
    btn.addEventListener('click', function(){
      var a = parseFloat(btn.getAttribute('data-a'));
      slider.value = a;
      aValLabel.textContent = a.toFixed(2);
      draw(a);
    });
  });

  mq.addEventListener('change', function(){ draw(parseFloat(slider.value)); });

  draw(parseFloat(slider.value));
})();
</script>
</body>
</html>
